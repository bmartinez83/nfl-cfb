name: cfb-scan
# Logs CFB leans. Wed and Fri evenings (UTC), Sat morning and Sat just before the early games.
on:
  schedule:
    - cron: "0 20 * * 3"
    - cron: "0 20 * * 5"
    - cron: "0 14 * * 6"
    - cron: "30 15 * * 6"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tracker-data
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Cache CFB history (2019-2025 only needs pulling once)
        uses: actions/cache@v4
        with:
          path: data/raw/cfb
          key: cfb-history-v1
      - name: Pull CFB data
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          python src/cfb_pull.py --start 2019
          python src/cfb_pull.py --start 2026 --refresh
      - run: python -W ignore src/cfb_weekly.py
      - run: |
          git config user.name "tracker-bot"
          git config user.email "tracker-bot@users.noreply.github.com"
          git add outputs
          git diff --cached --quiet || (git commit -m "cfb scan $(date -u +%FT%TZ)" && git pull --rebase && git push)
