name: nfl-scan
# Logs NFL leans + the current line + injury flags. HOURLY 14:00-03:00 UTC (7am-8pm PT), Wed-Mon, so line moves and
# nflverse injury updates are caught; rows are only logged when a line or injury note changes. Tuesday is the grade day.
on:
  schedule:
    - cron: "0 14-23 * * 0,1,3,4,5,6"
    - cron: "0 0-3 * * 0,1,2,4,5,6"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tracker-data
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -W ignore src/nfl_weekly.py --refresh
      - run: |
          git config user.name "tracker-bot"
          git config user.email "tracker-bot@users.noreply.github.com"
          git add outputs
          git diff --cached --quiet || (git commit -m "nfl scan $(date -u +%FT%TZ)" && git pull --rebase && git push)
